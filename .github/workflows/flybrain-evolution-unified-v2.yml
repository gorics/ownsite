name: FlyBrain Evolution Unified v2

on:
  push:
    branches: [flybrain-evolution-unified-20260929]
    paths:
      - 'tools/flybrain_evolution_unified_v2.py'
      - '.github/workflows/flybrain-evolution-unified-v2.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  run-v2:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      HF_HUB_DISABLE_TELEMETRY: '1'
      TOKENIZERS_PARALLELISM: 'false'
      OMP_NUM_THREADS: '4'
      MKL_NUM_THREADS: '4'
      FLY_OUT: flybrain-evolution-v2-results
      POPULATION: '24'
      GENERATIONS: '40'
      FLY_REPO: flybrain-src
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install ML packages
        run: |
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install 'transformers>=4.48,<5' 'diffusers>=0.33,<0.40' accelerate safetensors sentencepiece huggingface_hub pillow numpy
      - name: Clone FlyBrain
        run: git clone --depth 1 https://github.com/snedea/flybrain.git flybrain-src
      - name: Run v2
        run: |
          mkdir -p "$FLY_OUT"
          python -u tools/flybrain_evolution_unified_v2.py | tee "$FLY_OUT/runner.log"
      - name: Verify numerical fusion
        run: |
          python - <<'PY'
          import json, math
          from pathlib import Path
          p=Path('flybrain-evolution-v2-results')
          r=json.loads((p/'unified_result.json').read_text())
          assert r['status']=='ok'
          assert r['connectome']['neurons']==139255
          assert r['llm']['model']=='HuggingFaceTB/SmolLM2-135M-Instruct'
          assert r['llm']['loss_after'] < r['llm']['loss_before']
          assert r['evolution']['metrics']['new_edges'] > 0
          vals=r['fusion']['motor_logits']+r['fusion']['final_organ_state']
          assert all(math.isfinite(float(x)) for x in vals)
          print(json.dumps(r,indent=2)[:15000])
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: flybrain-evolution-unified-v2-results
          path: flybrain-evolution-v2-results/
          retention-days: 30
