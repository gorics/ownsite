name: FlyBrain Continuous Evolution

on:
  schedule:
    - cron: '7,37 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/flybrain-continuous-evolution.yml'

permissions:
  contents: read

env:
  FLY_STATE_DIR: flybrain-state
  FLY_REPO: flybrain-src
  GENERATIONS_PER_CYCLE: '120'
  CONTINUOUS_POPULATION: '32'
  OMP_NUM_THREADS: '4'
  MKL_NUM_THREADS: '4'

concurrency:
  group: flybrain-continuous-evolution
  cancel-in-progress: false

jobs:
  evolve:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout organism code
        uses: actions/checkout@v4
        with:
          ref: flybrain-evolution-unified-20260929
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install structural evolution runtime
        run: pip install numpy
      - name: Restore latest evolving genome
        id: restore
        uses: actions/cache/restore@v4
        with:
          path: flybrain-state
          key: flybrain-state-v1-${{ github.run_id }}
          restore-keys: |
            flybrain-state-v1-
      - name: Clone canonical open-source FlyBrain
        run: git clone --depth 1 https://github.com/snedea/flybrain.git flybrain-src
      - name: Continue Darwinian structural evolution
        run: |
          python -u tools/flybrain_continuous_evolve.py | tee continuous-evolution.log
          python - <<'PY'
          import json
          r=json.load(open('flybrain-state/state.json'))
          assert r['status']=='ok'
          assert r['connectome']['neurons']==139255
          assert r['connectome']['edges']==2698236
          assert r['total_generations']>=120
          assert r['structural_genome']['new_edges']>0
          print('persistent cycle=',r['cycle'],'total_generations=',r['total_generations'])
          PY
      - name: Save genome for next evolutionary cycle
        uses: actions/cache/save@v4
        with:
          path: flybrain-state
          key: flybrain-state-v1-${{ github.run_id }}
      - name: Publish this generation snapshot
        uses: actions/upload-artifact@v4
        with:
          name: flybrain-continuous-state-${{ github.run_number }}
          path: |
            flybrain-state/
            continuous-evolution.log
          retention-days: 30
