name: FlyBrain Hybrid Run

on:
  push:
    branches:
      - flybrain-hybrid-run
    paths:
      - flybrain_hybrid_remote.py
      - .github/workflows/flybrain-hybrid-run.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  hybrid:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      HF_HUB_DISABLE_TELEMETRY: '1'
      TOKENIZERS_PARALLELISM: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: flybrain-hybrid-run
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install ML dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --index-url https://download.pytorch.org/whl/cpu torch torchvision
          pip install 'transformers>=4.46,<5' 'diffusers>=0.31,<0.41' 'accelerate>=1.0,<2' 'peft>=0.13,<1' sentencepiece pillow safetensors
      - name: Execute hybrid
        run: python flybrain_hybrid_remote.py
      - name: Print summary
        if: always()
        run: |
          find hybrid-result -maxdepth 3 -type f -printf '%p %k KB\n' | sort || true
          test -f hybrid-result/run_summary.json && cat hybrid-result/run_summary.json || true
      - name: Upload result artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flybrain-hybrid-${{ github.run_id }}
          path: hybrid-result/
          if-no-files-found: warn
          retention-days: 1
      - name: Persist text results
        if: always()
        run: |
          mkdir -p flybrain-result
          cp hybrid-result/run_summary.json flybrain-result/run_summary.json 2>/dev/null || true
          cp hybrid-result/llm_output.txt flybrain-result/llm_output.txt 2>/dev/null || true
          echo -n "$GITHUB_RUN_ID" > flybrain-result/run_id.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add flybrain-result
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Persist FlyBrain hybrid result [skip ci]'
          git push origin HEAD:flybrain-hybrid-run
