name: FlyBrain Real Hybrid

on:
  push:
    branches: [flybrain-hybrid-run]
    paths:
      - 'tools/flybrain_hybrid_real.py'
      - '.github/workflows/flybrain-hybrid-real.yml'
  workflow_dispatch:

jobs:
  run-hybrid:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      HF_HUB_DISABLE_TELEMETRY: '1'
      TOKENIZERS_PARALLELISM: 'false'
      OMP_NUM_THREADS: '4'
      MKL_NUM_THREADS: '4'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: flybrain-hybrid-run
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CPU ML stack
        run: |
          python -m pip install --upgrade pip
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install 'transformers>=4.48,<5' 'diffusers>=0.33,<0.40' 'accelerate>=1.2,<2' safetensors sentencepiece huggingface_hub
      - name: Clone open-source FlyBrain
        run: |
          git clone --depth 1 https://github.com/snedea/flybrain.git flybrain-src
          ls -lh flybrain-src/data/
      - name: Run connectome -> LLM -> Stable Diffusion
        env:
          FLY_REPO: flybrain-src
          FLY_OUT: flybrain-real-results
        run: |
          mkdir -p flybrain-real-results
          python -u tools/flybrain_hybrid_real.py | tee flybrain-real-results/runner.log
      - name: Upload actual outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flybrain-real-hybrid-results
          path: flybrain-real-results/
          if-no-files-found: warn
          retention-days: 7
