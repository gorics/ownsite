name: temp-build-kice-socialculture
on:
  push:
    branches: [main]
    paths:
      - 'scripts/build_kice_socialculture_latest.py'
      - '.github/workflows/temp-build-kice-socialculture.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install pymupdf requests beautifulsoup4 gdown
      - name: Build PDF
        run: python scripts/build_kice_socialculture_latest.py
      - name: Verify PDF
        run: |
          python - <<'PY'
          import fitz, os
          p='KICE_socialculture_2014-2027_latest_first.pdf'
          d=fitz.open(p)
          toc=d.get_toc()
          print('pages=', d.page_count)
          print('bookmarks=', len(toc))
          print('size=', os.path.getsize(p))
          print('first=', toc[:3])
          print('last=', toc[-3:])
          assert len(toc) == 41
          assert toc[0][1] == '2027학년도 9월 모의평가'
          assert toc[1][1] == '2027학년도 6월 모의평가'
          assert toc[-1][1] == '2014학년도 6월 모의평가'
          assert d.page_count >= 164
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: KICE_socialculture_2014-2027_latest_first
          path: KICE_socialculture_2014-2027_latest_first.pdf
          retention-days: 1
